version: '3.8'

services:
  # 1. InfluxDB（时序数据库，存储监控数据）
  influxdb:
    image: docker.xuanyuan.run/influxdb:1.11   # 使用你已拉取的镜像
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"           # InfluxDB HTTP API 端口
      - "8088:8088"           # RPC 端口（备份/恢复）
    environment:
      - INFLUXDB_HTTP_AUTH_ENABLED=false   # 简化配置，暂不开启认证
      - INFLUXDB_DB=cadvisor               # 自动创建数据库（仅适用于 1.x 版本）
    volumes:
      - ./influxdb/data:/var/lib/influxdb  # 数据持久化
    networks:
      - monitoring

  # 2. cAdvisor（容器监控数据采集器）
  cadvisor:
    image: docker.xuanyuan.run/google/cadvisor:canary   # 使用你已拉取的镜像
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"           # cAdvisor Web UI
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - -storage_driver=influxdb
      - -storage_driver_db=cadvisor          # 数据库名称
      - -storage_driver_host=influxdb:8086   # InfluxDB 服务地址（容器名:端口）
    depends_on:
      - influxdb
    networks:
      - monitoring

  # 3. Grafana（数据可视化面板）
  grafana:
    image: docker.xuanyuan.run/grafana/grafana:nightly-slim   # 使用你已拉取的镜像
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"           # Grafana Web UI
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin    # 管理员密码（默认 admin/admin）
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - ./grafana/data:/var/lib/grafana     # Grafana 数据持久化
      - ./grafana/logs:/var/log/grafana     # 日志目录
      - ./grafana/config:/etc/grafana       # 配置文件目录（可选）
    depends_on:
      - influxdb
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge