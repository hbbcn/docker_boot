version: '3.8'

services:
  # 若本地已有 MySQL/Redis 在运行，可注释掉 mysql 和 redis 服务，
  # 并将 app 中的连接地址改为宿主机实际 IP
  mysql:
    image: docker.xuanyuan.run/bingozhou/mysql5.7:latest
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: hbb_demo
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "3306:3306"
    volumes:
      - /app/mysql/db:/var/lib/mysql
      - /app/mysql/conf/my.cnf:/etc/my.cnf
      - /app/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - atguigu_net

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - /app/redis/redis.conf:/etc/redis/redis.conf
      - /app/redis/data:/data
    networks:
      - atguigu_net

  app:
    image: hbbcn_docker:1.7
    container_name: ms01
    ports:
      - "6001:6001"
    depends_on:
      - mysql
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hbb_demo?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_MVC_PATHMATCH_MATCHING_STRATEGY: ant_path_matcher
    networks:
      - atguigu_net

networks:
  atguigu_net: